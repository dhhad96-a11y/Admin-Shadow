<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW - Reseller & Admin Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020204;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 15, 15, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 90%, rgba(100, 0, 0, 0.08) 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.4s ease-in-out;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .auth-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid rgba(255, 34, 34, 0.35);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 0 45px rgba(255, 34, 34, 0.25);
            backdrop-filter: blur(20px);
        }

        .brand-section {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 34, 34, 0.07);
            border: 1px solid rgba(255, 34, 34, 0.25);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 10px;
            font-weight: 800;
            color: #ff3333;
            letter-spacing: 2px;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(255, 34, 34, 0.1);
        }

        .main-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            font-style: italic;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(255, 34, 34, 0.4);
        }

        .sub-title {
            font-size: 14px;
            font-weight: 700;
            color: #ff3333;
            letter-spacing: 3px;
            font-style: italic;
            margin-top: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }

        .divider-glow {
            width: 45px;
            height: 3px;
            background: #ff2222;
            border-radius: 99px;
            margin: 14px 0;
            box-shadow: 0 0 12px #ff2222;
        }

        .epic-quote {
            font-size: 10px;
            color: #888899;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .input-box-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-icon-left {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            filter: drop-shadow(0 0 5px rgba(255, 51, 51, 0.6));
        }

        .input-icon-right {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        .input-icon-right:hover {
            opacity: 1;
        }

        .key-input {
            width: 100%;
            background: #08080c;
            border: 1px solid #1e1e2d;
            border-radius: 16px;
            padding: 16px 45px 16px 48px;
            color: #fff;
            font-size: 13px;
            outline: none;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
            text-align: center;
        }

        .key-input:focus {
            border-color: #ff2222;
            background: #0d0d14;
            box-shadow: 0 0 20px rgba(255, 34, 34, 0.25), inset 0 2px 6px rgba(0,0,0,0.8);
        }

        .unlock-btn {
            width: 100%;
            background: linear-gradient(135deg, #cc1111, #ff2222);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(230, 25, 25, 0.45);
            letter-spacing: 2px;
        }

        .unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 34, 34, 0.7);
        }

        /* لوحة التحكم (Dashboard) */
        .dashboard-card {
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid rgba(255, 34, 34, 0.35);
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 45px rgba(255, 34, 34, 0.25);
            backdrop-filter: blur(20px);
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a24;
        }
        .admin-title {
            font-size: 13px;
            font-weight: 700;
            color: #ddddf0;
        }
        .balance-badge {
            background: #1a0808;
            border: 1px solid #4a1515;
            color: #ff4d4d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #ff3333;
            margin: 15px 0 8px;
            border-left: 3px solid #ff3333;
            padding-left: 8px;
            text-align: left;
            letter-spacing: 1px;
        }
        .form-label {
            font-size: 10px;
            color: #888899;
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
            font-weight: 600;
        }
        .select-box, .text-input {
            width: 100%;
            background: #08080c;
            border: 1px solid #1e1e2d;
            border-radius: 12px;
            padding: 12px;
            color: #e1e1f0;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        .select-box:focus, .text-input:focus {
            border-color: #ff2222;
        }
        .reseller-list {
            max-height: 110px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .list-item {
            background: #08080c;
            border: 1px solid #1e1e2d;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #ff5555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #2a0808;
            border: 1px solid #551111;
            color: #ff4d4d;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
        .key-single-box {
            background: #08080c;
            border: 2px dashed #ff3333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 12px 0;
        }
        .key-single-text {
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .copy-btn {
            background: #1e1e2d;
            border: 1px solid #333344;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            color: #888899;
            cursor: pointer;
            text-decoration: underline;
        }
        .back-link:hover {
            color: #fff;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: #120505;
            border: 1px solid #ff2222;
            color: #fff;
            padding: 12px 26px;
            border-radius: 999px;
            font-weight: bold;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 6000;
            box-shadow: 0 0 30px rgba(255, 34, 34, 0.7);
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1h9PKwJ98fDDVbV5dxLScJZjXMyz-2k4",
            authDomain: "bbbdhr-cfb74.firebaseapp.com",
            projectId: "bbbdhr-cfb74",
            storageBucket: "bbbdhr-cfb74.firebasestorage.app",
            messagingSenderId: "772597383789",
            appId: "1:772597383789:android:4bad4df8683fb54e7e3564"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;

        window.loadCloudData();
    </script>
</head>
<body>

    <div id="toast">✓ Success!</div>

    <!-- شاشة تسجيل دخول الأدمن أو الموزع -->
    <div id="loginScreen" class="screen active">
        <div class="auth-container">
            <div class="brand-section">
                <div class="badge-pill">🔒 ADMIN & RESELLER</div>
                <div class="main-title">SHADOW</div>
                <div class="sub-title">CONTROL PANEL</div>
                <div class="divider-glow"></div>
                <div class="epic-quote">ENTER ADMIN PASSWORD (ADHAM) OR USERNAME</div>
            </div>

            <div class="input-box-wrapper">
                <span class="input-icon-left">👤</span>
                <input type="password" class="key-input" id="userInput" placeholder="Password or Username">
                <span class="input-icon-right" onclick="togglePassVisibility()">👁️‍🗨️</span>
            </div>

            <button class="unlock-btn" onclick="handleLogin()">ACCESS PANEL</button>
        </div>
    </div>

    <!-- لوحة التحكم المتكاملة -->
    <div id="dashboardScreen" class="screen">
        <div class="dashboard-card">
            <div class="dash-header">
                <span class="admin-title" id="panelTitle">👑 Control Panel</span>
                <span class="balance-badge" id="accountBalance">UNLIMITED</span>
            </div>

            <!-- قسم إدارة الموزعين (يظهر للأدمن ADHAM فقط) -->
            <div id="adminResellerSection" style="display:none;">
                <div class="section-title">👥 Manage Resellers</div>
                <label class="form-label">Reseller Username:</label>
                <input type="text" class="text-input" id="resellerName" placeholder="Username">
                <label class="form-label">Initial Balance ($):</label>
                <input type="number" class="text-input" id="resellerBalance" value="20">
                <button class="unlock-btn" style="padding: 12px; font-size: 13px; margin-bottom: 12px;" onclick="addReseller()">➕ Add Reseller Account</button>
                <label class="form-label">Active Resellers:</label>
                <div class="reseller-list" id="resellerContainer"></div>
            </div>

            <!-- قسم توليد الأكواد (متاح للأدمن والموزعين) -->
            <div class="section-title">🛒 Buy & Generate Key</div>
            <label class="form-label">📦 Product Type:</label>
            <select class="select-box" id="productType">
                <option value="Shadow V3">Shadow v3 - Happ VPN</option>
                <option value="Shadow Client">Shadow Client - Apk Mod</option>
            </select>
            <label class="form-label">⏳ Validity & Price:</label>
            <select class="select-box" id="validity">
                <option value="0.50" data-days="1">1 Day - $0.50</option>
                <option value="3.00" data-days="7">7 Days - $3.00</option>
                <option value="10.00" data-days="30">30 Days - $10.00</option>
            </select>
            <button class="unlock-btn" style="padding: 14px; font-size: 14px;" onclick="buyAndGenerateKey()">🛒 BUY & GENERATE KEY</button>

            <div class="key-single-box" id="singleKeyBox" style="display:none;">
                <div class="form-label">Generated Key Code:</div>
                <div class="key-single-text" id="generatedKeyText">SHADOW_XXX_XXX</div>
                <button class="copy-btn" onclick="copyGeneratedKey()">📋 Copy Key</button>
            </div>

            <div class="back-link" onclick="logout()">🔒 Logout</div>
        </div>
    </div>

    <script>
        let cloudResellers = [];
        let currentUserType = "admin";
        let currentResellerId = null;
        let currentResellerData = null;

        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function togglePassVisibility() {
            let input = document.getElementById('userInput');
            input.type = input.type === "password" ? "text" : "password";
        }

        window.loadCloudData = async function() {
            try {
                const resellersSnap = await window.getDocs(window.collection(window.db, "resellers"));
                cloudResellers = resellersSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
            } catch (e) {
                console.error("Error loading cloud data:", e);
            }
        };

        function renderResellersUI() {
            let container = document.getElementById('resellerContainer');
            container.innerHTML = '';
            cloudResellers.forEach((r) => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span><b>${r.name}</b></span>
                    <div>
                        <span style="color:#2ecc71; margin-right:8px;">$${Number(r.balance).toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteResellerCloud('${r.firestoreId}')">Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.handleLogin = async function() {
            let val = document.getElementById('userInput').value.trim();
            if (!val) return alert("Please enter Admin Password or Reseller Username!");

            await window.loadCloudData();

            // كلمة مرور الأدمن المطلوبة: ADHAM
            if (val === "ADHAM" || val === "adham") {
                currentUserType = "admin";
                document.getElementById('panelTitle').innerText = "👑 Admin Panel";
                document.getElementById('accountBalance').innerText = "UNLIMITED";
                document.getElementById('adminResellerSection').style.display = 'block';
                showDashboard();
            } else {
                let found = cloudResellers.find(r => r.name.toLowerCase() === val.toLowerCase());
                if (found) {
                    currentUserType = "reseller";
                    currentResellerId = found.firestoreId;
                    currentResellerData = found;
                    document.getElementById('panelTitle').innerText = `👤 Seller: ${found.name}`;
                    document.getElementById('accountBalance').innerText = `$${Number(found.balance).toFixed(2)}`;
                    document.getElementById('adminResellerSection').style.display = 'none';
                    showDashboard();
                } else {
                    alert("❌ Invalid Admin Password or Reseller Username!");
                }
            }
        };

        function showDashboard() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('dashboardScreen').classList.add('active');
            renderResellersUI();
        }

        function logout() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('singleKeyBox').style.display = 'none';
            document.getElementById('userInput').value = '';
        }

        window.addReseller = async function() {
            let name = document.getElementById('resellerName').value.trim();
            let balance = parseFloat(document.getElementById('resellerBalance').value);

            if (!name) return alert('Please enter username');
            if (cloudResellers.some(r => r.name.toLowerCase() === name.toLowerCase())) {
                return alert('Username already exists!');
            }

            try {
                const docRef = await window.addDoc(window.collection(window.db, "resellers"), {
                    name: name,
                    balance: balance || 0
                });
                cloudResellers.push({ firestoreId: docRef.id, name: name, balance: balance || 0 });
                renderResellersUI();
                document.getElementById('resellerName').value = '';
                showToast(`✓ Reseller ${name} saved to Cloud!`);
            } catch (e) {
                alert("Error saving to Firebase: " + e.message);
            }
        };

        window.deleteResellerCloud = async function(firestoreId) {
            if (confirm("Delete this reseller?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "resellers", firestoreId));
                    cloudResellers = cloudResellers.filter(r => r.firestoreId !== firestoreId);
                    renderResellersUI();
                    showToast("✓ Reseller deleted!");
                } catch (e) {
                    alert("Error deleting: " + e.message);
                }
            }
        };

        // توليد الأكواد بالصيغة المطلوبة: SHADOW_XXX_XXX
        window.buyAndGenerateKey = async function() {
            let priceSelect = document.getElementById('validity');
            let price = parseFloat(priceSelect.value);
            let selectedOption = priceSelect.options[priceSelect.selectedIndex];
            let daysToAdd = parseInt(selectedOption.getAttribute('data-days')) || 1;

            if (currentUserType === "reseller") {
                if (currentResellerData.balance < price) {
                    return alert("❌ Insufficient balance!");
                }
                currentResellerData.balance -= price;
                
                try {
                    await window.updateDoc(window.doc(window.db, "resellers", currentResellerId), {
                        balance: currentResellerData.balance
                    });
                    document.getElementById('accountBalance').innerText = `$${Number(currentResellerData.balance).toFixed(2)}`;
                } catch (e) {
                    return alert("Error updating balance: " + e.message);
                }
            }

            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let part1 = '';
            let part2 = '';
            for (let i = 0; i < 3; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            for (let i = 0; i < 3; i++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
            
            let key = `SHADOW_${part1}_${part2}`;
            let expiryTimestamp = new Date().getTime() + (daysToAdd * 24 * 60 * 60 * 1000);

            try {
                await window.addDoc(window.collection(window.db, "keys"), { 
                    code: key,
                    expiresAt: expiryTimestamp 
                });

                document.getElementById('generatedKeyText').innerText = key;
                document.getElementById('singleKeyBox').style.display = 'block';
                showToast("✓ Key generated & saved to Cloud!");
            } catch (e) {
                alert("Error saving key: " + e.message);
            }
        };

        function copyGeneratedKey() {
            let text = document.getElementById('generatedKeyText').innerText;
            navigator.clipboard.writeText(text).then(() => showToast("Key Copied!"));
        }
    </script>
</body>
</html>
